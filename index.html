<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trakler AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://bernardo-castilho.github.io/DragDropTouch/DragDropTouch.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <nav class="sidebar">
        <div class="logo">✧ Trakler</div>
        <button class="nav active" data-target="view-today">Today</button>
        <button class="nav" data-target="view-upcoming">Upcoming</button>
        
        <div class="section">
            <p>Filters</p>
            <div class="filter-group">
                <button class="tag active-tag" data-filter="all">All <span id="inbox-count">0</span></button>
                <button class="tag" data-filter="focus">Priority</button>
                <button class="tag" data-filter="completed">Done</button>
            </div>
        </div>
    </nav>

    <main class="main">
        <section id="view-today" class="view-section active-view">
            <div class="stats-row">
                <div class="card stat-card">
                    <h3>Priority Focus</h3>
                    <div id="focus-area" class="text-muted">Empty</div>
                </div>
                <div class="card stat-card">
                    <h3>Daily Progress</h3>
                    <div id="stats-area"></div>
                </div>
            </div>

            <div class="card tasks-card">
                <h3>Inbox</h3>
                <div id="tasks" class="task-list"></div>
            </div>
        </section>

        <section id="view-upcoming" class="view-section hidden-view">
            <div class="card empty-state"><h2>📅</h2><p>Future sync coming soon.</p></div>
        </section>
    </main>

    <aside class="right">
        <div class="timeline-card">
            <h3>Timeline</h3>
            <div id="timeline-container">
                <div id="timeline"></div>
            </div>
        </div>
    </aside>
</div>

<div id="recycleBin" class="recycle-bin">🗑️</div>
<div id="systemToast" class="assistant">System Ready</div>

<div class="chatbot-container">
    <div class="chat-window" id="chatWindow">
        <div class="chat-header"><span>✨ Trakler AI</span><button id="closeChat">&times;</button></div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Add task (f: for priority)...">
            <button id="sendTaskBtn">Send</button>
        </div>
    </div>
    <button class="chat-fab" id="chatFab">💬</button>
</div>

<script src="script.js"></script>
</body>
</html>
