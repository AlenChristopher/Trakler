<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trackler AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://bernardo-castilho.github.io/DragDropTouch/DragDropTouch.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <nav class="sidebar">
        <div class="logo-container">
            <img src="Trackler.png" alt="Trackler" class="app-logo">
            <span class="logo-text">Trackler</span>
        </div>

        <div class="clock-container">
            <div class="analog-clock">
                <div class="hand hour" id="hour-hand"></div>
                <div class="hand minute" id="minute-hand"></div>
                <div class="hand second" id="second-hand"></div>
                <div class="center-dot"></div>
            </div>
            <div id="digital-time" class="digital-time">00:00:00</div>
        </div>

        <!-- Updated Nav Buttons to match style.css .nav class -->
        <button class="nav active" data-target="view-today">Today</button>
        <button class="nav" data-target="view-upcoming">Upcoming</button>
        
        <div class="section">
            <p class="section-label">Categories</p>
            <div class="filter-group">
                <button class="tag active-tag" data-filter="all">Inbox <span id="inbox-count">0</span></button>
                <button class="tag" data-filter="focus">Priority</button>
                <button class="tag" data-filter="completed">Done</button>
            </div>
        </div>
    </nav>

    <main class="main">
        <section id="view-today" class="view-section active-view">
            <div class="stats-row">
                <div class="card stat-card">
                    <h3>Focus</h3>
                    <!-- ID focus-area used by script.js to show top priority task -->
                    <div id="focus-area" class="text-muted">High Priority</div>
                </div>
                <div class="card stat-card">
                    <h3>Progress</h3>
                    <!-- ID stats-area used by script.js to render progress bar -->
                    <div id="stats-area"></div>
                </div>
            </div>

            <div class="card tasks-card">
                <h3>Your Tasks</h3>
                <div id="tasks" class="task-list"></div>
            </div>
        </section>

        <section id="view-upcoming" class="view-section hidden-view">
            <!-- Ensure empty state is ONLY in upcoming view -->
            <div class="card empty-state"><h2>📅</h2><p>Future sync coming soon.</p></div>
        </section>
    </main>

    <aside class="right">
        <div class="timeline-card">
            <h3>Timeline</h3>
            <div id="timeline-container">
                <div id="timeline"></div>
            </div>
        </div>
    </aside>
</div>

<!-- Feedback Toast -->
<div id="systemToast" class="assistant">Ready</div>

<!-- IMPROVED CHATBOT: Better hierarchy for "Lively" Floating logic -->
<div class="chatbot-container">
    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <div style="display:flex; align-items:center; gap:8px;">
                <span class="bot-status-dot"></span>
                <span>Trackler AI</span>
            </div>
            <!-- Standard Close replaced with a styled button in script.js -->
            <button id="closeChat" class="custom-close-btn">&times;</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <!-- Placeholder updated to reflect Smart Scheduling features -->
            <input type="text" id="chatInput" placeholder="Try 'Meeting @12:00'...">
            <button id="sendTaskBtn">Send</button>
        </div>
    </div>
    <button class="chat-fab" id="chatFab">💬</button>
</div>

<script src="script.js"></script>
</body>
</html>
