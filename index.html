<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trackler AI | Master Build</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <nav class="sidebar">
        <div class="logo-area">
            <img src="Trackler.png" alt="Trackler" class="app-logo">
            <span class="logo-text">Trackler</span>
        </div>
        
        <div class="clock-section">
            <div class="analog-clock" id="clock">
                <div class="hand hour" id="hour-hand"></div>
                <div class="hand minute" id="minute-hand"></div>
                <div class="hand second" id="second-hand"></div>
                <div class="center-dot"></div>
            </div>
            <div id="date-label" class="date-display">Wednesday, May 6</div>
            <div id="digital-time" class="time-display">00:00:00</div>
        </div>

        <div class="nav-controls">
            <button class="prime-btn">Today</button>
            <button class="prime-btn outline" onclick="App.openSummary()">📊 Day Summary</button>
        </div>
    </nav>

    <main class="dashboard">
        <div class="bento-row">
            <div class="card glass">
                <label>PRIORITY FOCUS</label>
                <div id="focus-area" class="focus-text">No urgent tasks</div>
            </div>
            <div class="card glass">
                <label>PROGRESS</label>
                <div class="progress-wrap">
                    <span id="stats-area">0%</span>
                    <div class="bar-bg"><div id="progress-fill" class="bar-fill"></div></div>
                </div>
            </div>
        </div>

        <div class="tasks-wrapper">
            <h3>Your Tasks</h3>
            <div id="tasks" class="task-grid"></div>
        </div>
        
        <div class="timeline-wrapper">
            <h3>Fluid Timeline</h3>
            <div id="timeline-container">
                <div id="timeline"></div>
            </div>
        </div>
    </main>
</div>

<div class="bot-overlay">
    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <div class="bot-info"><span class="status-dot"></span> Trackler AI</div>
            <button class="close-chat" onclick="App.toggleChat()">&times;</button>
        </div>
        <div id="chatMessages" class="chat-body">
            <div class="msg ai">Hi! I'm Trackler AI. Try typing 'Meeting @14:00 urgent' or just a task name.</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Try 'Meeting @12:00'...">
            <button id="sendBtn" class="purple-send">Send</button>
        </div>
    </div>
    <button class="floating-fab" onclick="App.toggleChat()">💬</button>
</div>

<script src="script.js"></script>
</body>
</html>
