<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trackler AI | 2026 Master Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #9333ea; --bg: #070709; --card: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.1); }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; }
        
        .app-grid { display: grid; grid-template-columns: 280px 1fr 340px; height: 100vh; padding: 20px; gap: 20px; box-sizing: border-box; }

        /* SIDEBAR & BRANDING */
        .sidebar { display: flex; flex-direction: column; gap: 20px; border-right: 1px solid var(--border); padding-right: 20px; }
        .logo-mini { width: 35px; height: 35px; border-radius: 8px; }
        .analog-clock { width: 110px; height: 110px; border: 2px solid var(--border); border-radius: 50%; position: relative; margin: 0 auto; background: rgba(255,255,255,0.02); }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; transform: translateX(-50%); border-radius: 5px; }
        .hour { width: 4px; height: 28px; background: #fff; z-index: 3; }
        .minute { width: 3px; height: 42px; background: #888; z-index: 2; }
        .second { width: 2px; height: 48px; background: var(--accent); z-index: 1; }
        
        /* MODERN BUTTONS */
        .btn-modern { background: var(--accent); border: none; padding: 12px; border-radius: 12px; color: #fff; font-weight: 700; cursor: pointer; width: 100%; transition: 0.3s; display: block; text-align: center; }
        .btn-outline { background: transparent; border: 1px solid var(--border); margin-top: 5px; }
        .btn-modern:hover { filter: brightness(1.2); transform: translateY(-1px); }

        /* TASK CARDS */
        .glass-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 24px; backdrop-filter: blur(10px); }
        .task-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 18px; border-radius: 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .task-card.priority { border-left: 5px solid var(--accent); background: rgba(147, 51, 234, 0.05); }

        /* PROGRESS RING */
        .prog-circle { font-size: 32px; font-weight: 800; color: var(--accent); margin-bottom: 5px; }

        /* CHATBOT (FIXED) */
        .bot-anchor { position: fixed; bottom: 30px; right: 30px; z-index: 9999; }
        .fab { width: 65px; height: 65px; border-radius: 50%; background: var(--accent); border: none; font-size: 28px; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .chat-win { position: absolute; bottom: 85px; right: 0; width: 340px; height: 500px; background: #0f1016; border: 1px solid var(--border); border-radius: 28px; display: none; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .chat-win.open { display: flex; }
        .chat-header { padding: 20px; background: rgba(255,255,255,0.03); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .bubble { padding: 12px 16px; border-radius: 18px; font-size: 14px; max-width: 85%; }
        .bubble.ai { background: rgba(255,255,255,0.08); align-self: flex-start; border-bottom-left-radius: 4px; }
        .bubble.user { background: var(--accent); align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-input { padding: 15px; display: flex; gap: 10px; background: rgba(0,0,0,0.2); }
        .chat-input input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: #fff; outline: none; }
        .chat-input button { background: var(--accent); border: none; padding: 0 20px; border-radius: 12px; color: #fff; font-weight: 700; cursor: pointer; }

        /* ANALYTICS MODAL */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 10001; }
        .modal.open { display: flex; }
        .modal-content { background: #111; padding: 30px; border-radius: 24px; width: 350px; text-align: center; border: 1px solid var(--border); }

        /* TIMELINE */
        .timeline-grid { height: 100%; overflow-y: auto; background: var(--card); border-radius: 24px; padding: 20px; border: 1px solid var(--border); }
        .t-slot { height: 70px; border-bottom: 1px solid rgba(255,255,255,0.02); position: relative; }
        .t-slot::after { content: attr(data-time); position: absolute; left: 0; top: -12px; font-size: 10px; color: #555; }

        @media (max-width: 900px) { .app-grid { display: flex; flex-direction: column; height: auto; } }
    </style>
</head>
<body>

<div class="app-grid">
    <nav class="sidebar">
        <div style="display:flex; align-items:center; gap:12px;">
            <img src="Trackler.png" alt="" class="logo-mini">
            <span style="font-weight:700; font-size:22px;">Trackler</span>
        </div>
        <div class="clock-box">
            <div class="analog-clock">
                <div class="hand hour" id="hour-hand"></div>
                <div class="hand minute" id="minute-hand"></div>
                <div class="hand second" id="second-hand"></div>
            </div>
            <div id="date-label" style="text-align:center; color:var(--accent); font-weight:700; margin-top:15px;"></div>
            <div id="digital-time" style="text-align:center; opacity:0.5; font-family:monospace;"></div>
        </div>
        <button class="btn-modern">Today</button>
        <button id="daySummaryBtn" class="btn-modern btn-outline">📊 Day Summary</button>
    </nav>

    <main>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:20px;">
            <div class="glass-card">
                <small style="opacity:0.5;">TOP FOCUS</small>
                <div id="focus-area" style="font-size:18px; font-weight:700; margin-top:10px;">Ready for tasks</div>
            </div>
            <div class="glass-card">
                <small style="opacity:0.5;">TOTAL PROGRESS</small>
                <div id="prog-val" class="prog-circle">0%</div>
                <div style="height:8px; background:rgba(255,255,255,0.1); border-radius:10px; overflow:hidden;">
                    <div id="prog-fill" style="height:100%; background:var(--accent); width:0%; transition:1s;"></div>
                </div>
            </div>
        </div>
        <div class="glass-card">
            <h3 style="margin-top:0;">Your Tasks</h3>
            <div id="task-list"></div>
        </div>
    </main>

    <aside class="timeline-grid">
        <h3 style="margin-top:0;">Timeline</h3>
        <div id="timeline-v" style="position:relative; height:1200px;"></div>
    </aside>
</div>

<div id="summaryModal" class="modal">
    <div class="modal-content">
        <h2 style="margin-top:0;">Analytics</h2>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin:20px 0;">
            <div><small>Done</small><h2 id="count-done" style="color:var(--accent);">0</h2></div>
            <div><small>Pending</small><h2 id="count-pending">0</h2></div>
        </div>
        <button class="btn-modern" id="closeSummaryBtn">Close</button>
    </div>
</div>

<div class="bot-anchor">
    <div class="chat-win" id="chatWin">
        <div class="chat-header">
            <span style="font-weight:700;">Trackler AI</span>
            <button id="closeChatBtn" style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer;">&times;</button>
        </div>
        <div class="chat-body" id="chatMsgs">
            <div class="bubble ai">Hi! I'm Trackler. Try typing "Meeting @14:00 urgent"</div>
        </div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Add a task...">
            <button id="sendMessageBtn">Send</button>
        </div>
    </div>
    <button id="fabBtn" class="fab">💬</button>
</div>

<script>
    const App = (function() {
        const state = { tasks: [], blocks: [] };

        const render = () => {
            const list = document.getElementById('task-list');
            const focus = document.getElementById('focus-area');
            const timeline = document.getElementById('timeline-v');
            
            list.innerHTML = ''; timeline.innerHTML = '';
            let doneCount = 0; let topTask = "Ready for tasks";

            // Draw hours in timeline
            for(let i=6; i<=22; i++) {
                const s = document.createElement('div'); s.className = 't-slot';
                s.setAttribute('data-time', i + ':00'); timeline.appendChild(s);
            }

            state.tasks.forEach(t => {
                if(t.done) doneCount++;
                if(t.urgent && !t.done) topTask = t.text;
                const el = document.createElement('div');
                el.className = `task-card ${t.urgent ? 'priority' : ''}`;
                el.innerHTML = `
                    <div style="display:flex; align-items:center; gap:12px;">
                        <input type="checkbox" ${t.done?'checked':''} onchange="App.toggleT(${t.id})">
                        <span style="${t.done?'text-decoration:line-through;opacity:0.4':''}">${t.text}</span>
                    </div>
                    <button onclick="App.deleteT(${t.id})" style="background:none;border:none;color:red;cursor:pointer;">&times;</button>
                `;
                list.appendChild(el);
            });

            state.blocks.forEach(b => {
                const t = state.tasks.find(x => x.id === b.taskId);
                if(t) {
                    const block = document.createElement('div');
                    block.style = `position:absolute; top:${(b.start-6)*70}px; left:0; right:0; background:var(--accent); border-radius:12px; padding:12px; font-size:12px; font-weight:700; z-index:10;`;
                    block.innerText = t.text;
                    timeline.appendChild(block);
                }
            });

            const pct = state.tasks.length ? Math.round((doneCount/state.tasks.length)*100) : 0;
            document.getElementById('prog-val').innerText = pct + '%';
            document.getElementById('prog-fill').style.width = pct + '%';
            focus.innerText = topTask;
        };

        return {
            toggleChat: () => document.getElementById('chatWin').classList.toggle('open'),
            toggleT: (id) => { const t = state.tasks.find(x=>x.id===id); if(t) t.done = !t.done; render(); },
            deleteT: (id) => { state.tasks = state.tasks.filter(x=>x.id!==id); state.blocks = state.blocks.filter(b=>b.taskId!==id); render(); },
            sendMessage: () => {
                const inp = document.getElementById('chatInput');
                const val = inp.value; if(!val) return;
                
                // Advanced Cleaner: Detects @14:00, @14, at 14:00 and priority keywords
                const urgent = /urgent|asap/i.test(val);
                const timeMatch = val.match(/@\d{1,2}(:\d{2})?|at\s\d{1,2}(:\d{2})?/i);
                
                let cleanName = val;
                let startHour = null;

                if (timeMatch) {
                    // Extract digits from the match to find the hour
                    const hourMatch = timeMatch[0].match(/\d{1,2}/);
                    if (hourMatch) startHour = parseInt(hourMatch[0]);
                    // Strip the time part from the task name
                    cleanName = cleanName.replace(timeMatch[0], '');
                }
                
                // Final clean: remove "urgent" and multiple spaces
                cleanName = cleanName.replace(/urgent|asap/gi, '').trim();

                const id = Date.now();
                state.tasks.push({ id, text: cleanName, done: false, urgent });
                if(startHour !== null) state.blocks.push({ taskId: id, start: startHour });
                
                render(); inp.value = '';
                document.getElementById('chatMsgs').innerHTML += `<div class="bubble user">${val}</div>`;
                document.getElementById('chatMsgs').scrollTop = 9999;
            },
            openSummary: () => {
                const done = state.tasks.filter(t => t.done).length;
                document.getElementById('count-done').innerText = done;
                document.getElementById('count-pending').innerText = state.tasks.length - done;
                document.getElementById('summaryModal').classList.add('open');
            },
            closeSummary: () => document.getElementById('summaryModal').classList.remove('open'),
            init: () => {
                // Attach Event Listeners properly
                document.getElementById('daySummaryBtn').onclick = App.openSummary;
                document.getElementById('closeSummaryBtn').onclick = App.closeSummary;
                document.getElementById('fabBtn').onclick = App.toggleChat;
                document.getElementById('closeChatBtn').onclick = App.toggleChat;
                document.getElementById('sendMessageBtn').onclick = App.sendMessage;
                
                setInterval(() => {
                    const n = new Date();
                    document.getElementById('second-hand').style.transform = `translateX(-50%) rotate(${n.getSeconds()*6}deg)`;
                    document.getElementById('minute-hand').style.transform = `translateX(-50%) rotate(${n.getMinutes()*6}deg)`;
                    document.getElementById('hour-hand').style.transform = `translateX(-50%) rotate(${n.getHours()*30 + n.getMinutes()*0.5}deg)`;
                    document.getElementById('digital-time').innerText = n.toLocaleTimeString();
                    document.getElementById('date-label').innerText = n.toDateString();
                }, 1000);
                render();
            }
        };
    })();
    document.addEventListener('DOMContentLoaded', App.init);
</script>
</body>
</html>
