<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trackler AI | 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS INTEGRATED DIRECTLY TO PREVENT LOADING ISSUES */
        :root { --accent: #9333ea; --bg: #070709; --card: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.1); }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; }
        
        .app-container { display: grid; grid-template-columns: 280px 1fr 340px; height: 100vh; padding: 20px; gap: 20px; box-sizing: border-box; }

        /* SIDEBAR & CLOCK */
        .sidebar { display: flex; flex-direction: column; gap: 20px; border-right: 1px solid var(--border); padding-right: 20px; }
        .logo-box { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .logo-mini { width: 35px; height: 35px; border-radius: 8px; }
        
        .analog-clock { width: 120px; height: 120px; border: 2px solid var(--border); border-radius: 50%; position: relative; margin: 0 auto; background: rgba(255,255,255,0.02); box-shadow: 0 0 20px rgba(147, 51, 234, 0.2); }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; transform: translateX(-50%); border-radius: 5px; }
        .hour { width: 4px; height: 28px; background: #fff; z-index: 3; }
        .minute { width: 3px; height: 42px; background: #888; z-index: 2; }
        .second { width: 2px; height: 48px; background: var(--accent); z-index: 1; }
        .center-dot { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); z-index: 4; }

        /* BUTTONS */
        .btn-modern { background: var(--accent); border: none; padding: 14px; border-radius: 14px; color: #fff; font-weight: 700; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn-outline { background: transparent; border: 1px solid var(--border); margin-top: 10px; }
        .btn-modern:hover { filter: brightness(1.2); transform: translateY(-2px); }

        /* TASK CARDS */
        .glass-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 24px; backdrop-filter: blur(10px); }
        .task-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 18px; border-radius: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .task-card.urgent-task { border-left: 5px solid var(--accent); background: rgba(147, 51, 234, 0.05); }

        /* PROGRESS */
        .progress-num { font-size: 32px; font-weight: 800; color: var(--accent); margin: 10px 0; }
        .progress-bar { height: 10px; background: rgba(255,255,255,0.1); border-radius: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: 1s ease-in-out; }

        /* CHATBOT OVERLAY (FIXED) */
        .bot-anchor { position: fixed; bottom: 30px; right: 30px; z-index: 9999; }
        .fab { width: 65px; height: 65px; border-radius: 50%; background: var(--accent); border: none; font-size: 28px; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.3s; }
        .chat-win { position: absolute; bottom: 85px; right: 0; width: 340px; height: 500px; background: #0f0f18; border: 1px solid var(--border); border-radius: 28px; display: none; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .chat-win.is-active { display: flex; }
        .chat-top { padding: 20px; background: rgba(255,255,255,0.03); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .chat-msgs { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .bubble { padding: 12px 16px; border-radius: 18px; font-size: 14px; max-width: 80%; line-height: 1.4; }
        .bubble.bot { background: rgba(255,255,255,0.08); align-self: flex-start; border-bottom-left-radius: 4px; }
        .bubble.user { background: var(--accent); align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-input { padding: 15px; display: flex; gap: 10px; background: rgba(0,0,0,0.2); }
        .chat-input input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: #fff; outline: none; }
        .chat-input button { background: var(--accent); border: none; padding: 0 20px; border-radius: 12px; color: #fff; font-weight: 700; cursor: pointer; }

        /* TIMELINE */
        .timeline-grid { height: 100%; overflow-y: auto; background: var(--card); border-radius: 24px; padding: 20px; border: 1px solid var(--border); }
        .t-slot { height: 70px; border-bottom: 1px solid rgba(255,255,255,0.02); position: relative; }
        .t-slot::after { content: attr(data-time); position: absolute; left: 0; top: -12px; font-size: 11px; color: #555; }

        @media (max-width: 900px) { .app-container { display: flex; flex-direction: column; height: auto; } .sidebar { border: none; padding: 0; } }
    </style>
</head>
<body>

<div class="app-container">
    <nav class="sidebar">
        <div class="logo-box">
            <img src="Trackler.png" alt="" class="logo-mini">
            <span style="font-weight:700; font-size:22px;">Trackler</span>
        </div>
        <div class="clock-area">
            <div class="analog-clock">
                <div class="hand hour" id="hour-h"></div>
                <div class="hand minute" id="minute-h"></div>
                <div class="hand second" id="second-h"></div>
                <div class="center-dot"></div>
            </div>
            <div id="date-label" style="text-align:center; color:var(--accent); font-weight:700; margin-top:15px;"></div>
            <div id="time-label" style="text-align:center; opacity:0.5; font-family:monospace; margin-top:5px;"></div>
        </div>
        <button class="btn-modern">Today</button>
        <button class="btn-modern btn-outline" onclick="openSummary()">📊 Day Summary</button>
    </nav>

    <main class="dashboard">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:20px;">
            <div class="glass-card">
                <small style="opacity:0.5;">TOP PRIORITY</small>
                <div id="top-focus" style="font-size:18px; font-weight:700; margin-top:10px;">Ready for tasks</div>
            </div>
            <div class="glass-card">
                <small style="opacity:0.5;">DAILY PROGRESS</small>
                <div id="prog-val" class="progress-num">0%</div>
                <div class="progress-bar"><div id="prog-fill" class="progress-fill"></div></div>
            </div>
        </div>
        <div class="glass-card">
            <h3 style="margin-top:0;">Your Tasks</h3>
            <div id="task-list"></div>
        </div>
    </main>

    <aside class="timeline-grid">
        <h3 style="margin-top:0;">Timeline</h3>
        <div id="timeline-v" style="position:relative; height:1200px;"></div>
    </aside>
</div>

<div class="bot-anchor">
    <div class="chat-win" id="chatWin">
        <div class="chat-top">
            <span style="font-weight:700;">Trackler AI</span>
            <button onclick="toggleChat()" style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer;">&times;</button>
        </div>
        <div class="chat-msgs" id="chatMsgs">
            <div class="bubble bot">Welcome! I'm your proactive assistant. Try: "Meeting at 3pm urgent"</div>
        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Add a task...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <button class="fab" onclick="toggleChat()">💬</button>
</div>

<script>
    // JS INTEGRATED DIRECTLY
    const appState = { tasks: [], blocks: [] };

    function toggleChat() { document.getElementById('chatWin').classList.toggle('is-active'); }

    function renderTasks() {
        const list = document.getElementById('task-list');
        const focus = document.getElementById('top-focus');
        const pVal = document.getElementById('prog-val');
        const pFill = document.getElementById('prog-fill');
        const timeline = document.getElementById('timeline-v');

        list.innerHTML = '';
        timeline.innerHTML = '';
        let doneCount = 0;
        let urgentText = "No urgent tasks";

        // Draw hours in timeline
        for(let i=6; i<=22; i++) {
            const slot = document.createElement('div');
            slot.className = 't-slot';
            slot.setAttribute('data-time', i + ':00');
            timeline.appendChild(slot);
        }

        appState.tasks.forEach(t => {
            if(t.done) doneCount++;
            if(t.urgent && !t.done) urgentText = t.text;

            const card = document.createElement('div');
            card.className = `task-card ${t.urgent ? 'urgent-task' : ''}`;
            card.innerHTML = `
                <div style="display:flex; align-items:center; gap:12px;">
                    <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleT(${t.id})" style="transform:scale(1.3);">
                    <span style="${t.done ? 'text-decoration:line-through; opacity:0.4' : ''}">${t.text}</span>
                </div>
                <button onclick="deleteT(${t.id})" style="background:none; border:none; color:#ff4d4d; font-size:20px; cursor:pointer;">&times;</button>
            `;
            list.appendChild(card);
        });

        // Add blocks to timeline
        appState.blocks.forEach(b => {
            const task = appState.tasks.find(x => x.id === b.taskId);
            if(task) {
                const bEl = document.createElement('div');
                bEl.style = `position:absolute; top:${(b.start-6)*70}px; left:0; right:0; background:var(--accent); border-radius:10px; padding:12px; font-size:12px; font-weight:700;`;
                bEl.innerText = task.text;
                timeline.appendChild(bEl);
            }
        });

        const percent = appState.tasks.length ? Math.round((doneCount/appState.tasks.length)*100) : 0;
        pVal.innerText = percent + '%';
        pFill.style.width = percent + '%';
        focus.innerText = urgentText;
    }

    function toggleT(id) {
        const t = appState.tasks.find(x => x.id === id);
        if(t) t.done = !t.done;
        renderTasks();
    }

    function deleteT(id) {
        appState.tasks = appState.tasks.filter(x => x.id !== id);
        appState.blocks = appState.blocks.filter(b => b.taskId !== id);
        renderTasks();
    }

    function sendMessage() {
        const inp = document.getElementById('userInput');
        const val = inp.value;
        if(!val) return;

        // User bubble
        const uB = document.createElement('div');
        uB.className = 'bubble user';
        uB.innerText = val;
        document.getElementById('chatMsgs').appendChild(uB);

        // Simple NLP
        const isUrgent = /urgent|asap|priority/i.test(val);
        const timeMatch = val.match(/at\s*(\d+)|@(\d+)/);
        const cleanName = val.replace(/urgent|asap|priority|at\s*\d+|@\d+/gi, '').trim();

        const newId = Date.now();
        appState.tasks.push({ id: newId, text: cleanName, done: false, urgent: isUrgent });
        if(timeMatch) {
            const hr = parseInt(timeMatch[1] || timeMatch[2]);
            appState.blocks.push({ taskId: newId, start: hr });
        }

        renderTasks();
        inp.value = '';
        document.getElementById('chatMsgs').scrollTop = 9999;
    }

    setInterval(() => {
        const n = new Date();
        document.getElementById('second-h').style.transform = `translateX(-50%) rotate(${n.getSeconds()*6}deg)`;
        document.getElementById('minute-h').style.transform = `translateX(-50%) rotate(${n.getMinutes()*6}deg)`;
        document.getElementById('hour-h').style.transform = `translateX(-50%) rotate(${n.getHours()*30 + n.getMinutes()*0.5}deg)`;
        document.getElementById('time-label').innerText = n.toLocaleTimeString();
        document.getElementById('date-label').innerText = n.toDateString();
    }, 1000);

    renderTasks();
</script>
</body>
</html>
