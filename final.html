<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trackler AI | Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ALL CSS INJECTED HERE TO PREVENT LOADING FAILURES */
        :root { --accent: #9333ea; --bg: #070709; --card: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.1); }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; }
        
        .app { display: grid; grid-template-columns: 280px 1fr 340px; height: 100vh; padding: 20px; gap: 20px; box-sizing: border-box; }
        
        /* LOGO & CLOCK */
        .app-logo-mini { width: 35px; height: 35px; border-radius: 8px; }
        .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; }
        .analog-clock { width: 100px; height: 100px; border: 2px solid var(--border); border-radius: 50%; position: relative; margin: 0 auto; background: rgba(255,255,255,0.02); }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; transform: translateX(-50%); border-radius: 5px; }
        .hour { width: 4px; height: 25px; background: #fff; }
        .minute { width: 3px; height: 35px; background: #888; }
        .second { width: 2px; height: 40px; background: var(--accent); }

        /* BUTTONS */
        .modern-btn { background: var(--accent); border: none; padding: 12px; border-radius: 12px; color: #fff; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 10px; transition: 0.2s; }
        .btn-outline { background: transparent; border: 1px solid var(--border); }

        /* DASHBOARD CARDS */
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; }
        .task-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .task-card.priority { border-left: 4px solid var(--accent); background: rgba(147, 51, 234, 0.05); }

        /* FLOATING CHAT (FIXED OVERLAY) */
        .bot-wrapper { position: fixed; bottom: 30px; right: 30px; z-index: 9999; }
        .chat-fab { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); border: none; font-size: 24px; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .chat-window { position: absolute; bottom: 80px; right: 0; width: 320px; height: 480px; background: #0f0f15; border: 1px solid var(--border); border-radius: 24px; display: none; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .chat-window.open { display: flex; }
        .chat-header { padding: 15px; background: rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 15px; font-size: 13px; max-width: 85%; }
        .msg.ai { background: rgba(255,255,255,0.08); align-self: flex-start; }
        .msg.user { background: var(--accent); align-self: flex-end; }
        .chat-input-row { padding: 12px; display: flex; gap: 8px; background: rgba(0,0,0,0.2); }
        #chatInput { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px; padding: 10px; color: white; outline: none; }
        #sendBtn { background: var(--accent); border: none; padding: 0 15px; border-radius: 10px; color: white; font-weight: 600; cursor: pointer; }

        @media (max-width: 900px) { .app { display: flex; flex-direction: column; padding: 10px; } }
    </style>
</head>
<body>

<div class="app">
    <nav class="sidebar">
        <div class="logo-area">
            <img src="Trackler.png" alt="" class="app-logo-mini">
            <span style="font-weight:700; font-size:20px;">Trackler</span>
        </div>
        <div class="clock-box">
            <div class="analog-clock">
                <div class="hand hour" id="hour-hand"></div>
                <div class="hand minute" id="minute-hand"></div>
                <div class="hand second" id="second-hand"></div>
            </div>
            <p id="date-label" style="text-align:center; color:var(--accent); font-weight:600; margin:10px 0 5px;"></p>
            <p id="digital-time" style="text-align:center; opacity:0.6; font-family:monospace;"></p>
        </div>
        <button class="modern-btn">Today</button>
        <button class="modern-btn btn-outline" onclick="openSummary()">📊 Day Summary</button>
    </nav>

    <main>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px;">
            <div class="card">
                <small style="opacity:0.6;">FOCUS</small>
                <div id="focus-area" style="font-weight:600; margin-top:5px;">Ready for tasks</div>
            </div>
            <div class="card">
                <small style="opacity:0.6;">PROGRESS</small>
                <div id="progress-val" style="font-weight:700; color:var(--accent); font-size:20px;">0%</div>
            </div>
        </div>
        <div class="card">
            <h3>Your Tasks</h3>
            <div id="tasks"></div>
        </div>
    </main>

    <aside class="card" style="height:fit-content;">
        <h3>Timeline</h3>
        <div id="timeline" style="position:relative; height:600px; border-left:1px solid var(--border); padding-left:20px;"></div>
    </aside>
</div>

<div class="bot-wrapper">
    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <span>Trackler AI</span>
            <button onclick="toggleChat()" style="background:none; border:none; color:white; font-size:20px;">&times;</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="msg ai">Hi! Try typing "Meeting at 3pm urgent"</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Write a task...">
            <button id="sendBtn">Send</button>
        </div>
    </div>
    <button class="chat-fab" onclick="toggleChat()">💬</button>
</div>

<script>
    const state = { tasks: [], blocks: [] };

    function toggleChat() { document.getElementById('chatWindow').classList.toggle('open'); }

    function render() {
        const tArea = document.getElementById('tasks');
        tArea.innerHTML = '';
        let done = 0;
        state.tasks.forEach(t => {
            if(t.done) done++;
            const el = document.createElement('div');
            el.className = `task-card ${t.urgent ? 'priority' : ''}`;
            el.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id})">
                    <span>${t.text}</span>
                </div>
                <button onclick="delTask(${t.id})" style="background:none; border:none; color:red;">&times;</button>
            `;
            tArea.appendChild(el);
        });
        document.getElementById('progress-val').innerText = state.tasks.length ? Math.round((done/state.tasks.length)*100)+'%' : '0%';
    }

    function toggleTask(id) {
        const t = state.tasks.find(x => x.id === id);
        if(t) t.done = !t.done;
        render();
    }

    function delTask(id) {
        state.tasks = state.tasks.filter(x => x.id !== id);
        render();
    }

    document.getElementById('sendBtn').onclick = () => {
        const inp = document.getElementById('chatInput');
        const val = inp.value;
        if(!val) return;
        const urgent = val.toLowerCase().includes('urgent');
        state.tasks.push({ id: Date.now(), text: val.replace(/urgent/gi,''), done: false, urgent });
        render();
        inp.value = '';
    };

    setInterval(() => {
        const n = new Date();
        document.getElementById('second-hand').style.transform = `translateX(-50%) rotate(${n.getSeconds()*6}deg)`;
        document.getElementById('minute-hand').style.transform = `translateX(-50%) rotate(${n.getMinutes()*6}deg)`;
        document.getElementById('hour-hand').style.transform = `translateX(-50%) rotate(${n.getHours()*30}deg)`;
        document.getElementById('digital-time').innerText = n.toLocaleTimeString();
        document.getElementById('date-label').innerText = n.toDateString();
    }, 1000);

    render();
</script>
</body>
</html>
